<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Caixinha de Reserva</title>
    
    <!-- LINK PARA O MANIFEST EMBUTIDO (PWA EM UM ÚNICO ARQUIVO) -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk1pbmhhIENhaXhpbmhhIGRlIFJlc2VydmEiLAogICJzaG9ydF9uYW1lIjogIkNhaXhpbmhhIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmMGZkZjQiLAogICJ0aGVtZV9jb2xvciI6ICIjMDU5NjY5IiwKICAib3JpZW50YXRpb24iOiAicG9ydHJhaXQiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2Nlbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi8yNDg5LzI0ODk3NTYucG5nIiwKICAgICAgInNpemVzIjogIjUxMng1MTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmciCiAgICB9CiAgXQp9">
    <meta name="theme-color" content="#059669">

    <style>
        :root {
            --primary: #059669; 
            --background: #f0fdf4;
            --text: #166534;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: #1e293b;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
        }
        h2 { margin-top: 0; color: var(--primary); text-align: center; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #334155; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }
        .row { display: flex; gap: 10px; }
        .row .flex-3 { flex: 3; }
        .row .flex-2 { flex: 2; }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #047857; }
        .resultado {
            margin-top: 24px;
            padding: 20px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            display: none;
        }
        .resultado h3 { margin-top: 0; color: #166534; }
        .metric { margin: 8px 0; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Minha Caixinha de Reserva</h2>
    <p class="subtitle">Planeje e calcule o crescimento do seu dinheiro congelado</p>
    
    <div class="form-group">
        <label for="nome">Qual é o seu nome?</label>
        <input type="text" id="nome" placeholder="Ex: Carlos Silva">
    </div>

    <div class="form-group">
        <label for="objetivo">Qual o objetivo dessa caixinha?</label>
        <input type="text" id="objetivo" placeholder="Ex: Reserva de Emergência, Carro Novo">
    </div>

    <div class="form-group">
        <label for="depositoInicial">Valor que vai colocar HOJE para começar (R$):</label>
        <input type="number" id="depositoInicial" placeholder="Ex: 1000" min="0" step="0.01">
    </div>

    <div class="form-group">
        <label for="depositoMensal">Quanto vai depositar por mês (R$):</label>
        <input type="number" id="depositoMensal" value="400" min="0" step="0.01">
    </div>

    <div class="form-group">
        <label for="tempo">Por quanto tempo o dinheiro ficará congelado?</label>
        <div class="row">
            <div class="flex-3">
                <input type="number" id="tempo" placeholder="Quantidade" min="1">
            </div>
            <div class="flex-2">
                <select id="tipoTempo">
                    <option value="meses">Meses</option>
                    <option value="anos">Anos</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="banco">Onde esse dinheiro vai render?</label>
        <select id="banco">
            <option value="0.005">Poupança Tradicional (~0,5% am)</option>
            <option value="0.0087" selected>Conta que rende 100% CDI (~0,87% am)</option>
            <option value="0.011">Renda Fixa Avançada (~1,1% am)</option>
        </select>
    </div>

    <button onclick="calcularCaixinha()">Criar Plano da Caixinha</button>

    <div id="resultado" class="resultado"></div>
</div>

<script>
// 1. ALGORITMO FINANCEIRO DA CAIXINHA
function calcularCaixinha() {
    const nome = document.getElementById('nome').value || 'Poupador';
    const objetivo = document.getElementById('objetivo').value || 'Minha Meta';
    const inicial = parseFloat(document.getElementById('depositoInicial').value) || 0;
    const mensal = parseFloat(document.getElementById('depositoMensal').value) || 0;
    let tempo = parseInt(document.getElementById('tempo').value);
    const tipoTempo = document.getElementById('tipoTempo').value;
    const taxaMensal = parseFloat(document.getElementById('banco').value);

    if (isNaN(tempo) || tempo <= 0 || (inicial === 0 && mensal === 0)) {
        alert('Por favor, informe o tempo de bloqueio e pelo menos um valor de depósito.');
        return;
    }

    let tempoEmMeses = tempo;
    if (tipoTempo === 'anos') {
        tempoEmMeses = tempo * 12;
    }

    let totalInvestidoDoBolso = inicial;
    let saldoAcumuladoComJuros = inicial;

    for (let mes = 1; mes <= tempoEmMeses; mes++) {
        let juroDoMes = saldoAcumuladoComJuros * taxaMensal;
        saldoAcumuladoComJuros += juroDoMes;
        saldoAcumuladoComJuros += mensal;
        totalInvestidoDoBolso += mensal;
    }

    const jurosGanhos = saldoAcumuladoComJuros - totalInvestidoDoBolso;
    const bbr = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    const divRes = document.getElementById('resultado');
    divRes.style.display = 'block';
    divRes.innerHTML = `
        <h3>🎯 Meta: ${objetivo}</h3>
        <p class="metric"><strong>Poupador:</strong> ${nome}</p>
        <p class="metric"><strong>Tempo de Bloqueio Real:</strong> ${tempoEmMeses} Meses</p>
        <hr style="border: 0; border-top: 1px solid #bbf7d0; margin: 12px 0;">
        <p class="metric"><strong>Total tirado do bolso:</strong> ${bbr(totalInvestidoDoBolso)}</p>
        <p class="metric"><strong>Juros pagos pelo banco:</strong> <span style="color: #059669; font-weight:bold;">+ ${bbr(jurosGanhos)}</span></p>
        <p class="metric" style="font-size: 18px; margin-top: 12px;"><strong>Valor Total no Resgate:</strong> <span style="color: #166534; font-weight:bold;">${bbr(saldoAcumuladoComJuros)}</span></p>
    `;
}

// 2. ATIVAÇÃO DO SERVICE WORKER (EM EMBUTIDO PARA RODAR OFFLINE)
if ('serviceWorker' in navigator) {
    // Código JavaScript embutido para criar o arquivo dinamicamente na execução
    const swCode = `
        const CACHE_NAME = 'caixinha-v1';
        self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['.'])));
        });
        self.addEventListener('fetch', e => {
            e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);

    navigator.serviceWorker.register(swUrl)
        .then(() => console.log("PWA de Arquivo Único Conectado!"))
        .catch(err => console.log("Nota: O PWA precisa rodar via localhost para ativação total. Erro:", err));
}
</script>

</body>
</html>
