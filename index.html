<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Minha Caixinha de Reserva</title> 
    <link rel="manifest" href="manifest.json"> 
    <link rel="icon" type="image/x-icon" href="logo.ico"> 
    <meta name="theme-color" content="#059669"> 
    <style> 
        :root { 
            --primary: #059669; 
            --background: #f0fdf4; 
            --text: #166534; 
        } 
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--background); 
            color: #1e293b; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        } 
        .container { 
            background: white; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 480px; 
        } 
        h2 { margin-top: 0; color: var(--primary); text-align: center; } 
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; } 
        .form-group { margin-bottom: 16px; } 
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #334155; } 
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; } 
        input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; } 
        .row { display: flex; gap: 10px; } 
        .row .flex-3 { flex: 3; } 
        .row .flex-2 { flex: 2; } 
        
        button { 
            width: 100%; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s; 
            margin-bottom: 10px; 
        } 
        button:hover { background-color: #047857; } 
        
        .painel-acumulado { 
            background: #e0f2fe; 
            border: 1px solid #bae6fd; 
            padding: 16px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center; 
        } 
        .painel-acumulado h3 { margin: 0 0 8px 0; color: #0369a1; font-size: 16px; } 
        .saldo-real { font-size: 26px; font-weight: bold; color: #0c4a6e; } 
        .btn-adicionar { background-color: #0284c7; } 
        .btn-adicionar:hover { background-color: #0369a1; } 
        .btn-limpar { background-color: #ef4444; font-size: 12px; padding: 6px; margin-top: 5px;} 
        .btn-limpar:hover { background-color: #dc2626; } 
        
        .resultado { 
            margin-top: 24px; 
            padding: 20px; 
            background: #f0fdf4; 
            border: 1px solid #bbf7d0; 
            border-radius: 8px; 
            display: none; 
        } 
        .resultado h3 { margin-top: 0; color: #166534; } 
        .metric { margin: 8px 0; font-size: 15px; } 
    </style> 
</head>
<body> 
<div class="container"> 
    <h2>📦 Minha Caixinha de Reserva</h2> 
    <p class="subtitle">Acompanhe seu progresso real e simule o futuro</p> 
    
    <!-- Painel de Acúmulo Dinâmico -->
    <div class="painel-acumulado"> 
        <h3>💰 Meu Montante Guardado</h3> 
        <div class="saldo-real" id="saldoRealExibido">R$ 0,00</div> 
        <p style="font-size: 12px; color: #64748b; margin: 4px 0 12px 0;">(Dinheiro salvo no seu navegador)</p> 
        
        <div class="row"> 
            <div class="flex-3"> 
                <input type="number" id="novoAporteReal" placeholder="Valor do depósito (R$)" step="0.01"> 
            </div> 
            <div class="flex-2"> 
                <button onclick="adicionarDinheiroReal()" class="btn-adicionar" style="padding: 12px; font-size: 14px;">Anexar</button> 
            </div> 
        </div> 
        <button onclick="limparHistorico()" class="btn-limpar">Zerar Caixinha</button> 
    </div> 

    <!-- Inputs de Configuração -->
    <div class="form-group"> 
        <label for="nome">Qual é o seu nome?</label> 
        <input type="text" id="nome" placeholder="Ex: Carlos Silva"> 
    </div> 

    <div class="form-group"> 
        <label for="objetivo">Qual o objetivo dessa caixinha?</label> 
        <input type="text" id="objetivo" placeholder="Ex: Reserva de Emergência"> 
    </div> 

    <div class="form-group"> 
        <label for="depositoMensal">Quanto planeja depositar por mês (R$):</label> 
        <input type="number" id="depositoMensal" value="400" min="0" step="0.01"> 
    </div> 

    <div class="form-group"> 
        <label for="tempo">Por quanto tempo o dinheiro vai render?</label> 
        <div class="row"> 
            <div class="flex-3"> 
                <input type="number" id="tempo" placeholder="Quantidade" min="1"> 
            </div> 
            <div class="flex-2"> 
                <select id="tipoTempo"> 
                    <option value="meses">Meses</option> 
                    <option value="anos">Anos</option> 
                </select> 
            </div> 
        </div> 
    </div> 

    <div class="form-group"> 
        <label for="banco">Onde esse dinheiro vai render?</label> 
        <select id="banco"> 
            <option value="0.005">Poupança Tradicional (~0,5% am)</option> 
            <option value="0.0087" selected>Conta 100% CDI (~0,87% am)</option> 
            <option value="0.011">Renda Fixa Avançada (~1,1% am)</option> 
        </select> 
    </div> 

    <button onclick="calcularCaixinha()">Ver Projeção Futura</button> 
    <div id="resultado" class="resultado"></div> 
</div>
<script> 
const bbr = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); 
let saldoAcumuladoReal = 0; 

// Executa ao abrir a página
window.addEventListener('load', () => { 
    const saldoSalvo = localStorage.getItem('caixinha_saldo_real'); 
    if (saldoSalvo) { 
        saldoAcumuladoReal = parseFloat(saldoSalvo); 
    } 
    atualizarPainelVisual(); 
}); 

function adicionarDinheiroReal() { 
    const inputAporte = document.getElementById('novoAporteReal'); 
    const valor = parseFloat(inputAporte.value); 

    if (isNaN(valor) || valor <= 0) { 
        alert('Digite um valor válido para anexar.'); 
        return; 
    } 

    saldoAcumuladoReal += valor; 
    localStorage.setItem('caixinha_saldo_real', saldoAcumuladoReal); 
    inputAporte.value = ''; 
    atualizarPainelVisual(); 
    
    if(document.getElementById('tempo').value) { 
        calcularCaixinha(); 
    } 
} 

function atualizarPainelVisual() { 
    document.getElementById('saldoRealExibido').innerText = bbr(saldoAcumuladoReal); 
} 

function limparHistorico() { 
    if (confirm('Deseja zerar seu montante guardado?')) { 
        saldoAcumuladoReal = 0; 
        localStorage.removeItem('caixinha_saldo_real'); 
        atualizarPainelVisual(); 
        document.getElementById('resultado').style.display = 'none'; 
    } 
} 

function calcularCaixinha() { 
    const nome = document.getElementById('nome').value || 'Poupador'; 
    const objetivo = document.getElementById('objetivo').value || 'Minha Meta'; 
    const mensal = parseFloat(document.getElementById('depositoMensal').value) || 0; 
    let tempo = parseInt(document.getElementById('tempo').value); 
    const tipoTempo = document.getElementById('tipoTempo').value; 
    const taxaMensal = parseFloat(document.getElementById('banco').value); 

    if (isNaN(tempo) || tempo <= 0) { 
        alert('Informe o tempo de projeção.'); 
        return; 
    } 

    let tempoEmMeses = tipoTempo === 'anos' ? tempo * 12 : tempo; 
    let totalInvestidoDoBolso = saldoAcumuladoReal; 
    let saldoAcumuladoComJuros = saldoAcumuladoReal; 

    for (let mes = 1; mes <= tempoEmMeses; mes++) { 
        saldoAcumuladoComJuros += saldoAcumuladoComJuros * taxaMensal; 
        saldoAcumuladoComJuros += mensal; 
        totalInvestidoDoBolso += mensal; 
    } 

    const jurosGanhos = saldoAcumuladoComJuros - totalInvestidoDoBolso; 
    const divRes = document.getElementById('resultado'); 
    divRes.style.display = 'block'; 
    divRes.innerHTML = ` 
        <h3>🎯 Meta: ${objetivo}</h3> 
        <p class="metric"><strong>Poupador:</strong> ${nome}</p> 
        <p class="metric"><strong>Tempo:</strong> ${tempoEmMeses} Meses</p> 
        <hr style="border: 0; border-top: 1px solid #bbf7d0; margin: 12px 0;"> 
        <p class="metric"><strong>Montante Inicial Guardado:</strong> ${bbr(saldoAcumuladoReal)}</p> 
        <p class="metric"><strong>Aportes Futuros Somados:</strong> ${bbr(totalInvestidoDoBolso - saldoAcumuladoReal)}</p> 
        <p class="metric"><strong>Juros Estimados do Período:</strong> <span style="color: #059669; font-weight:bold;">+ ${bbr(jurosGanhos)}</span></p> 
        <p class="metric" style="font-size: 18px; margin-top: 12px;"><strong>Previsão de Resgate Total:</strong> <span style="color: #166534; font-weight:bold;">${bbr(saldoAcumuladoComJuros)}</span></p> 
    `; 
} 

if ('serviceWorker' in navigator) { 
    window.addEventListener('load', () => { 
        navigator.serviceWorker.register('sw.js') 
            .then(() => console.log("PWA Ativado!")) 
            .catch(err => console.log("Erro PWA:", err)); 
    }); 
} 
</script> 
</body> 
</html>
